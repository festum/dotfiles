setupVersion: 2
defaultProvider: bifrost
defaultModel: opencode-go/mimo-v2.5
defaultThinkingLevel: auto
enabledModels:
  - opencode-go/mimo-v2.5
  - opencode-go/muse-spark-1.2-contributor
  - opencode-go/ox-alpha-free
  - Copilot/gpt-5.3-codex
  - cursor/cursor-grok-4.6-medium
memory:
  backend: hindsight
hindsight:
  apiUrl: http://s0.bombay-city.ts.net:8888
  bankId: pi-s0
  scoping: global
  recallTimeoutMs: 180000
providers:
  streamIdleTimeoutSeconds: 120
startup:
  quiet: true
textVerbosity: low
hideThinkingBlock: true
statusLine:
  preset: compact
  compactThinkingLevel: true
  separator: powerline-thin
  contextLine: percentage
personality: pragmatic
retry:
  maxRetries: 2
tools:
  artifactSpillThreshold: 20
  artifactHeadBytes: 10
  artifactTailBytes: 10
dev:
  autoqaConsent: granted
modelRoles:
  {}
composer:
  shape: borderless
omitThinking: true
prewalk:
  enabled: true
tui:
  textSizing: true
  renderMermaid: true
  tight: true
  imeSafeCursor: true
task:
  showResolvedModelBadge: true
theme:
  dark: dark-twilight
