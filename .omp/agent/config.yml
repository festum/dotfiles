setupVersion: 2
defaultProvider: bifrost
defaultModel: opencode-go/main
defaultThinkingLevel: auto
enabledModels:
  - opencode-go/main
  - opencode-go/smart
  - opencode-go/canary
  - Copilot/sonnet
  - bansos/nvidia/nemotron-3-ultra-550b-a55b:free
  - bansos/muse-spark-1.3-contributor-free
  - bansos/minimax/minimax-m3:free
  - bansos/mimo-v2.5-free
  - bansos/nvidia/nemotron-3.5-lightning:free
  - bansos/stepfun/step-3.7-flash:free
  - bansos/big-pickle
memory:
  backend: hindsight
hindsight:
  apiUrl: https://hindsight.bombay-city.ts.net
  bankId: pi-s0
  scoping: global
  recallTimeoutMs: 180000
providers:
  streamIdleTimeoutSeconds: 120
startup:
  quiet: true
hideThinkingBlock: true
omitThinking: true
textVerbosity: low
personality: pragmatic
statusLine:
  preset: compact
  compactThinkingLevel: true
  separator: powerline-thin
  contextLine: percentage
retry:
  maxRetries: 2
tools:
  artifactSpillThreshold: 20
  artifactHeadBytes: 10
  artifactTailBytes: 10
dev:
  autoqaConsent: granted
modelRoles:
  plan: opencode-go/smart
  default: opencode-go/main
prewalk:
  enabled: true
plan:
  defaultOnStartup: false
composer:
  shape: borderless
tui:
  textSizing: true
  renderMermaid: true
  tight: true
  imeSafeCursor: true
task:
  showResolvedModelBadge: true
theme:
  dark: dark-twilight
browser:
  relay: true