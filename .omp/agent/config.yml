setupVersion: 2
defaultProvider: bifrost
defaultModel: opencode-go/main
defaultThinkingLevel: auto
enabledModels:
  - opencode-go/main
  - opencode-go/smart
  - opencode-go/unstable
  - Copilot/sonnet
memory:
  backend: hindsight
hindsight:
  apiUrl: https://hindsight.bombay-city.ts.net
  bankId: pi-s0
  scoping: global
  recallTimeoutMs: 180000
providers:
  streamIdleTimeoutSeconds: 120
startup:
  quiet: true
hideThinkingBlock: false
omitThinking: true
textVerbosity: low
personality: pragmatic
statusLine:
  preset: compact
  compactThinkingLevel: true
  separator: powerline-thin
  contextLine: percentage
retry:
  maxRetries: 2
tools:
  artifactSpillThreshold: 20
  artifactHeadBytes: 10
  artifactTailBytes: 10
dev:
  autoqaConsent: granted
modelRoles:
  plan: opencode-go/smart
  smol: opencode-go/main
  default: opencode-go/main
prewalk:
  enabled: true
plan:
  defaultOnStartup: false
composer:
  shape: borderless
tui:
  textSizing: true
  renderMermaid: true
  tight: true
  imeSafeCursor: true
task:
  showResolvedModelBadge: true
theme:
  dark: dark-twilight
