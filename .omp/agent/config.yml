setupVersion: 3
defaultThinkingLevel: medium
hideThinkingBlock: true
omitThinking: true
enabledModels:
  - bifrost/**
  - bansos/**
  - mlx/**
modelRoles:
  default: bifrost/opencode-go/main:medium
  plan: bifrost/opencode-go/smart
  advisor: bifrost/opencode-go/canary
prewalk.enabled: true
advisor:
  enabled: true
  reviewInterval: 3
  reviewMode: agent-end
checkpoint.enabled: false
plan.defaultOnStartup: false
hindsight:
  apiUrl: https://hindsight.bombay-city.ts.net
  bankId: pi-s0
  scoping: global
  recallTimeoutMs: 180000
compaction.supersedeReads: false
providers.streamIdleTimeoutSeconds: 120
startup.quiet: true
textVerbosity: low
personality: pragmatic
statusLine:
  preset: compact
  compactThinkingLevel: true
  separator: powerline-thin
  contextLine: percentage
retry.maxRetries: 2
theme.dark: dark-twilight
task.showResolvedModelBadge: true
tools:
  artifactSpillThreshold: 20
  artifactHeadBytes: 10
  artifactTailBytes: 10
composer.shape: borderless
tui:
  textSizing: true
  renderMermaid: true
  tight: true
  imeSafeCursor: true
browser.relay: true
dev:
  autoqaConsent: granted
providers:
  streamFirstEventTimeoutSeconds: 120
  streamIdleTimeoutSeconds: 120
memory:
  backend: hindsight
  hindsight:
    bankId: pi-s0
    scoping: global
    retainEveryNTurns: 10
    retainOverlapTurns: 5
    recallBudget: low
update:
  auto: auto
