providers:
  bifrost:
    baseUrl: https://bifrost.bombay-city.ts.net/v1
    api: openai-completions
    apiKey: env:OMP_BIFROST_API_KEY
    compat:
      supportsDeveloperRole: false
      supportsReasoningEffort: false
    models:
    - id: opencode-go/main
      name: Main
      reasoning: true
      input:
      - text
    - id: opencode-go/smart
      name: Smart
      reasoning: true
      input:
      - text
    - id: opencode-go/canary
      name: Canary
      reasoning: true
      input:
      - text
    - id: opencode-go/free
      name: Free
      reasoning: true
      input:
      - text
    - id: copilot/main
      name: Luna
      reasoning: true
      input:
      - text
    - id: copilot/smart
      name: Sol
      reasoning: true
      input:
      - text
