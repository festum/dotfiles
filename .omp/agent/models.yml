providers:
  opencode-go:
    baseUrl: https://bifrost.bombay-city.ts.net/v1
    api: openai-completions
    apiKey: env:OMP_BIFROST_API_KEY
    compat:
      supportsDeveloperRole: false
      supportsReasoningEffort: false
    models:
    - id: main
      name: Main
      reasoning: true
      input:
      - text
    - id: smart
      name: Smart
      reasoning: true
      input:
      - text
    - id: canary
      name: Canary
      reasoning: true
      input:
      - text
  copilot:
    baseUrl: https://bifrost.bombay-city.ts.net/v1
    api: openai-completions
    apiKey: env:OMP_BIFROST_API_KEY
    compat:
      supportsDeveloperRole: false
      supportsReasoningEffort: false
    models:
    - id: main
      name: Luna
      reasoning: true
      input:
      - text
    - id: smart
      name: Sol
      reasoning: true
      input:
      - text
