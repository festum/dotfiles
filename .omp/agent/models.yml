providers:
  opencode-go:
    baseUrl: https://bifrost.bombay-city.ts.net/v1
    api: openai-completions
    apiKey: env:OMP_BIFROST_API_KEY
    compat:
      supportsDeveloperRole: false
      supportsReasoningEffort: false
    models:
    - id: main
      name: Main
      reasoning: true
      input:
      - text
    - id: smart
      name: Smart
      reasoning: true
      input:
      - text
    - id: unstable
      name: Unstable
      reasoning: true
      input:
      - text
  Copilot:
    baseUrl: https://bifrost.bombay-city.ts.net/v1
    api: openai-completions
    apiKey: env:OMP_BIFROST_API_KEY
    compat:
      supportsDeveloperRole: false
      supportsReasoningEffort: false
    models:
    - id: sonnet
      name: Sonnet
      reasoning: true
      input:
      - text
    - id: opus
      name: Opus
      reasoning: true
      input:
      - text
    - id: luna
      name: Luna
      reasoning: true
      input:
      - text
