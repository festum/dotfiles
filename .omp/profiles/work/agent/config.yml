setupVersion: 2
defaultProvider: cursor
defaultModel: default
defaultThinkingLevel: auto
enabledModels:
  - bifrost/opencode-go/smart
  - bifrost/opencode-go/main
  - bifrost/opencode-go/canary
  - bifrost/opencode-go/free
  - cursor/default
  - cursor/grok-4.7-medium
  - cursor/claude-opus-5.5-thinking-max
  - cursor/claude-fable-5.1-medium
  - anthropic/claude-sonnet-5.5
  - anthropic/claude-opus-5.5
  - google-antigravity/gemini-3.1-pro
  - google-antigravity/gemini-3.8-flash
  - google-antigravity/claude-sonnet-4-6
  - google-antigravity/gpt-oss-120b
  - bansos/nvidia/nemotron-3-ultra-550b-a55b:free
  - bansos/muse-spark-1.3-contributor-free
  - bansos/minimax/minimax-m3:free
  - bansos/mimo-v2.5-free
  - bansos/nvidia/nemotron-3.5-lightning:free
  - bansos/stepfun/step-3.7-flash:free
  - bansos/big-pickle
memory:
  backend: hindsight
hindsight:
  apiUrl: https://hindsight.bombay-city.ts.net
  bankId: claude-ppro
  scoping: global
  recallTimeoutMs: 180000
providers:
  streamIdleTimeoutSeconds: 120
startup:
  quiet: true
hideThinkingBlock: false
omitThinking: true
textVerbosity: low
personality: pragmatic
statusLine:
  preset: compact
  compactThinkingLevel: true
  separator: powerline-thin
  contextLine: percentage
retry:
  maxRetries: 2
tools:
  artifactSpillThreshold: 20
  artifactHeadBytes: 10
  artifactTailBytes: 10
dev:
  autoqaConsent: granted
modelRoles:
  default: bifrost/opencode-go/main
  plan: bifrost/opencode-go/smart:auto
prewalk:
  enabled: true
plan:
  defaultOnStartup: true
composer:
  shape: borderless
tui:
  textSizing: true
  renderMermaid: true
  tight: true
  imeSafeCursor: true
task:
  showResolvedModelBadge: true
theme:
  dark: dark-twilight