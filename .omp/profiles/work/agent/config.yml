setupVersion: 2
defaultThinkingLevel: auto
hideThinkingBlock: true
omitThinking: true
enabledModels:
  - bifrost/opencode-go/*
  - cursor/default
  - cursor/grok-4.7-medium
  - cursor/claude-opus-5.5-thinking-max
  - cursor/claude-fable-5.1-medium
  - anthropic/claude-sonnet-5-5
  - anthropic/claude-opus-5-5
  - google-antigravity/gemini-3.1-pro
  - google-antigravity/gemini-3.8-flash
  - google-antigravity/claude-sonnet-4-6
  - google-antigravity/gpt-oss-120b
  - bansos/*
modelRoles:
  default: bifrost/opencode-go/main
  plan: bifrost/opencode-go/canary:auto
  advisor: bifrost/opencode-go/canary:auto
prewalk.enabled: true
advisor:
  enabled: true
  reviewInterval: 3
  reviewMode: agent-end
checkpoint.enabled: false
plan.defaultOnStartup: true
memory.backend: hindsight
hindsight:
  apiUrl: https://hindsight.bombay-city.ts.net
  bankId: claude-ppro
  scoping: global
  recallTimeoutMs: 180000
providers.streamIdleTimeoutSeconds: 120
startup.quiet: true
textVerbosity: low
personality: pragmatic
statusLine:
  preset: compact
  compactThinkingLevel: true
  separator: powerline-thin
  contextLine: percentage
retry.maxRetries: 2
tools:
  artifactSpillThreshold: 20
  artifactHeadBytes: 10
  artifactTailBytes: 10
composer.shape: borderless
tui:
  textSizing: true
  renderMermaid: true
  tight: true
  imeSafeCursor: true
task.showResolvedModelBadge: true
theme.dark: dark-twilight
browser.relay: true
dev:
  autoqaConsent: granted
providers:
  streamFirstEventTimeoutSeconds: 120
  streamIdleTimeoutSeconds: 120